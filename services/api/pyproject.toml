[project]
name = "mindmitra-api"
version = "0.0.0"
description = "MindMitra backend — FastAPI modular monolith (SIH 2026, PS26003)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "aiosqlite>=0.20",   # dev / test (no Neon connection required)
    "asyncpg>=0.30",     # production: Neon PostgreSQL
    "pyjwt>=2.9",        # authN token signing — a security boundary, not hand-rolled
    "openai>=1.60",      # Azure OpenAI via AsyncAzureOpenAI
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]
# AI deps added when orchestrator lands:
# ai = ["langgraph>=0.2", "litellm>=1.55"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.per-file-ignores]
# The codebase deliberately uses `class X(str, Enum)` rather than `StrEnum`:
# Pydantic v2 serialises both, but `str(X.A)` differs between them, and the
# enum values appear in audit rows and reason codes that tests assert on.
"*" = ["UP042"]
